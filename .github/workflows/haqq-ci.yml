name: HAQQ CI
on:
  push:
    paths: ["haqq/**", ".github/workflows/haqq-ci.yml"]
  pull_request:
    paths: ["haqq/**", ".github/workflows/haqq-ci.yml"]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: haqq, POSTGRES_PASSWORD: haqq, POSTGRES_DB: haqq_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-ara poppler-utils
      # In production haqq_db.sh runs inside the database container, so pg_dump always matches the server.
      # Do the same here: run the PostgreSQL client tools from the database image itself.
      - name: Use PostgreSQL 16 client tools from the database image
        run: |
          mkdir -p "$RUNNER_TEMP/pg16"
          for t in pg_dump pg_restore psql createdb dropdb; do
            printf '#!/bin/sh\nexec docker run --rm -i --network host -v /tmp:/tmp -e PGHOST -e PGPORT -e PGPASSWORD -e PGUSER -e PGDATABASE -e PGOPTIONS pgvector/pgvector:pg16 %s "$@"\n' "$t" > "$RUNNER_TEMP/pg16/$t"
            chmod +x "$RUNNER_TEMP/pg16/$t"
          done
          echo "$RUNNER_TEMP/pg16" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pg16/pg_dump" --version
      - run: pip install -r haqq/backend/requirements-dev.txt
      - run: cd haqq/backend && ruff check app tests eval
      - run: cd haqq/backend && pytest -q
        env: { HAQQ_DATABASE_URL: "postgresql+psycopg2://haqq:haqq@localhost:5432/haqq_test", HAQQ_REQUIRE_PG_TOOLS: "1" }
      - run: cd haqq/backend && python -m eval.run_eval
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd haqq/frontend && npm ci && npm run build
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd haqq && docker compose build
