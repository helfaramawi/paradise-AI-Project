# Future Mirror AI — local / on-premises deployment
#   docker compose up -d --build                      # core platform on http://localhost:8080
#   docker compose --profile automation up -d         # + n8n on http://localhost:5678
#   docker compose --profile d365sim up -d --build    # + Dynamics 365 F&O simulator on https://localhost:8443 (ops/d365-sim)
name: future-mirror

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-future_mirror}
      POSTGRES_USER: ${POSTGRES_USER:-fm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fm} -d ${POSTGRES_DB:-future_mirror}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    image: future-mirror-backend
    env_file:
      - path: .env
        required: false
    environment:
      FM_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-fm}:${POSTGRES_PASSWORD:-change-me-db}@db:5432/${POSTGRES_DB:-future_mirror}
      FM_ENVIRONMENT: ${FM_ENVIRONMENT:-development}
      FM_CORS_ORIGINS: '["http://localhost:8080"]'
      FM_N8N_BASE_URL: ${FM_N8N_BASE_URL:-}
    volumes:
      # CA certificate of the local F&O simulator (empty unless the d365sim profile has run).
      # Trusted only when FM_D365_CA_BUNDLE=/certs/d365sim/ca.pem is set in .env.
      - d365sim-certs:/certs/d365sim:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: future-mirror-frontend
    ports:
      - "${FM_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:1.72.1
    profiles: ["automation"]
    ports:
      - "5678:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Africa/Cairo
      # Read by the workflows in automation/n8n (see its README)
      FM_API_URL: http://backend:8000/api/v1
      FM_API_EMAIL: ${FM_N8N_API_EMAIL:-cfo@futuremirror.demo}
      FM_API_PASSWORD: ${FM_N8N_API_PASSWORD:-FutureMirror!2026}
      FM_APP_URL: http://localhost:${FM_HTTP_PORT:-8080}
      FM_FROM_EMAIL: ${FM_N8N_FROM_EMAIL:-future-mirror@example.com}
      FM_ALERT_EMAIL: ${FM_N8N_ALERT_EMAIL:-approvers@example.com}
      FM_HR_EMAIL: ${FM_N8N_HR_EMAIL:-hr@example.com}
      FM_ROLE_EMAILS: ${FM_N8N_ROLE_EMAILS:-}
    volumes:
      - n8ndata:/home/node/.n8n
    restart: unless-stopped

  d365fo-sim:
    build: ./tools/d365fo-simulator
    image: future-mirror-d365fo-sim
    profiles: ["d365sim"]
    ports:
      - "${FM_D365_SIM_PORT:-8443}:8443"
    environment:
      # Must match the backend's FM_D365_FO_CLIENT_SECRET (both read from .env).
      SIM_CLIENT_SECRET: ${FM_D365_FO_CLIENT_SECRET:-fm-sim-secret-2026}
      SIM_PUBLIC_URLS: https://d365fo-sim:8443,https://localhost:8443,https://localhost:${FM_D365_SIM_PORT:-8443}
    volumes:
      - d365sim-certs:/certs
    restart: unless-stopped

volumes:
  pgdata:
  n8ndata:
  d365sim-certs:
